        <rect x="42" width="34" height="34" rx="7" fill="#4F7A52" fill-opacity="0.6"/>
        <rect x="84" width="34" height="34" rx="7" fill="#8C8A44" fill-opacity="0.66"/>
        <rect x="126" width="34" height="34" rx="7" fill="#C08A38" fill-opacity="0.72"/>
        <rect x="168" width="34" height="34" rx="7" fill="#C4512D" fill-opacity="0.8"/>
        <rect x="210" width="34" height="34" rx="7" fill="#C08A38" fill-opacity="0.74"/>
