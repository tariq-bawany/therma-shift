        <rect x="42" width="34" height="34" rx="7" fill="#8C8A44" fill-opacity="0.7"/>
        <rect x="84" width="34" height="34" rx="7" fill="#C08A38" fill-opacity="0.78"/>
        <rect x="126" width="34" height="34" rx="7" fill="#C4512D" fill-opacity="0.85"/>
        <rect x="168" width="34" height="34" rx="7" fill="#C4512D" fill-opacity="0.92"/>
        <rect x="210" width="34" height="34" rx="7" fill="#E0532A" fill-opacity="0.95"/>
        <rect x="252" width="34" height="34" rx="7" fill="#C4512D" fill-opacity="0.85"/>
        <rect x="294" width="34" height="34" rx="7" fill="#C08A38" fill-opacity="0.7"/>
      </g>
