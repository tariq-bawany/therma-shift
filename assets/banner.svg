    </g>
    <g transform="translate(630,232)">
      <rect width="186" height="34" rx="17" fill="#F6F1E8" fill-opacity="0.05" stroke="#F6F1E8" stroke-opacity="0.16"/>
      <text x="18" y="22" fill="#C3CAD4">Human-in-the-Loop</text>
    </g>
  </g>

