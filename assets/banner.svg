<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ThermaShift AI — autonomous heat-safety dispatching">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11141A"/>
      <stop offset="55%" stop-color="#171B22"/>
      <stop offset="100%" stop-color="#241A17"/>
    </linearGradient>
    <radialGradient id="ember" cx="12%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#C4512D" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#C4512D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4512D"/>
      <stop offset="55%" stop-color="#E0A23C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F6F1E8" stop-opacity="0.08"/>
    </linearGradient>
    <g id="cell0"><rect width="34" height="34" rx="7"/></g>
  </defs>

  <!-- background -->
  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#ember)"/>

  <!-- thermal contour lines -->
  <g fill="none" stroke="#F6F1E8" stroke-opacity="0.055" stroke-width="1.4">
    <path d="M-20 300 C 180 190, 320 360, 560 250 S 900 360, 1300 220"/>
    <path d="M-20 250 C 200 140, 340 310, 580 200 S 920 310, 1300 170"/>
    <path d="M-20 200 C 220 90, 360 260, 600 150 S 940 260, 1300 120"/>
    <path d="M-20 150 C 240 40, 380 210, 620 100 S 960 210, 1300 70"/>
    <path d="M-20 100 C 260 -10, 400 160, 640 50 S 980 160, 1300 20"/>
  </g>

  <!-- title -->
  <text x="72" y="132" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F6F1E8" letter-spacing="-1.5">ThermaShift <tspan fill="#FF7A45">AI</tspan></text>

  <!-- tagline -->
  <text x="74" y="176" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9AA3AF">Autonomous heat-safety dispatching for construction crews</text>

  <!-- rule -->
  <rect x="74" y="204" width="300" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(74,232)">
      <rect width="252" height="34" rx="17" fill="#C4512D" fill-opacity="0.14" stroke="#C4512D" stroke-opacity="0.55"/>
      <circle cx="18" cy="17" r="4.5" fill="#FF7A45"/>
      <text x="32" y="22" fill="#F7C6B4">FortyGuard Temperature API</text>
    </g>
    <g transform="translate(340,232)">
      <rect width="112" height="34" rx="17" fill="#F6F1E8" fill-opacity="0.05" stroke="#F6F1E8" stroke-opacity="0.16"/>
      <text x="18" y="22" fill="#C3CAD4">n8n engine</text>
    </g>
    <g transform="translate(466,232)">
      <rect width="150" height="34" rx="17" fill="#F6F1E8" fill-opacity="0.05" stroke="#F6F1E8" stroke-opacity="0.16"/>
