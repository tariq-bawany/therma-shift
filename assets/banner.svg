        <rect x="210" width="34" height="34" rx="7" fill="#C4512D" fill-opacity="0.85"/>
        <rect x="252" width="34" height="34" rx="7" fill="#C08A38" fill-opacity="0.75"/>
        <rect x="294" width="34" height="34" rx="7" fill="#8C8A44" fill-opacity="0.65"/>
      </g>
      <g transform="translate(0,168)">
